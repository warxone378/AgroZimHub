{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto">
    <h2 class="text-2xl font-bold mb-4">My Profile</h2>
    <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
        <div class="flex justify-center mb-4">
            <div class="w-24 h-24 bg-emerald-100 rounded-full flex items-center justify-center text-3xl font-bold text-emerald-600">
                {{ user.username[0]|upper }}
            </div>
        </div>
        <form method="POST">
            <div class="mb-3"><label class="block mb-1">Phone</label><input type="tel" name="phone" value="{{ user.phone_number }}" class="w-full p-2 border rounded dark:bg-gray-700"></div>
            <div class="mb-3"><label class="block mb-1">Province</label><select name="province" class="w-full p-2 border rounded dark:bg-gray-700">{% for p in provinces %}<option {% if user.location_province == p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div>
            <button type="submit" class="btn-primary w-full py-2">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
