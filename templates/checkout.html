{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Checkout</h2>
    <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
        <h3 class="font-semibold text-lg mb-3">Order Summary</h3>
        {% for item in items %}
        <div class="flex justify-between py-1">
            <span>{{ item.title }} x {{ item.quantity }} kg</span>
            <span>${{ "%.2f"|format(item.subtotal) }}</span>
        </div>
        {% endfor %}
        <div class="border-t pt-2 mt-2 flex justify-between font-bold">
            <span>Total</span>
            <span>${{ "%.2f"|format(total) }}</span>
        </div>
    </div>
    <form method="POST" class="bg-white rounded-xl shadow-sm p-6">
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Delivery Address</label>
            <textarea name="address" required class="w-full p-2 border border-gray-300 rounded-lg" rows="2"></textarea>
        </div>
        <div class="mb-6">
            <label class="block text-sm font-medium mb-1">Payment Method</label>
            <select name="payment" required class="w-full p-2 border border-gray-300 rounded-lg">
                <option value="Cash on Delivery">Cash on Delivery</option>
                <option value="Mobile Money (EcoCash)">Mobile Money (EcoCash)</option>
                <option value="Bank Transfer">Bank Transfer</option>
            </select>
        </div>
        <button type="submit" class="btn-primary w-full py-2">Place Order</button>
    </form>
</div>
{% endblock %}
