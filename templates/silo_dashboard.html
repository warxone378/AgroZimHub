{% extends "base.html" %}
{% block content %}
<h2 class="text-3xl font-bold mb-4">🌾 Smart Silo Monitor</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="card p-6 text-center"><div class="text-4xl mb-2">💧</div><p class="text-lg font-semibold">Moisture</p><p class="text-2xl">{{ silo.moisture }}%</p></div>
    <div class="card p-6 text-center"><div class="text-4xl mb-2">🌡️</div><p class="text-lg font-semibold">Temperature</p><p class="text-2xl">{{ silo.temperature }}°C</p></div>
    <div class="card p-6 text-center"><div class="text-4xl mb-2">📦</div><p class="text-lg font-semibold">Fill Level</p><p class="text-2xl">{{ silo.fill_level }}%</p></div>
</div>
<div class="mt-6 card p-4"><p class="font-semibold">Grain Quality: {{ silo.grain_quality }}</p></div>
{% endblock %}
