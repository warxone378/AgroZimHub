{% extends "base.html" %}
{% block content %}
<div class="flex justify-center items-center min-h-[70vh]">
    <div class="card w-full max-w-md p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">Welcome Back</h2>
        <p class="text-center text-gray-500 mb-6">Login to your AgroZim account</p>
        <form method="POST">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
            </div>
            <button type="submit" class="btn-primary w-full py-2.5">Login</button>
        </form>
        <div class="mt-6 text-center">
            <a href="/forgot_password" class="text-sm text-emerald-600 hover:underline">Forgot password?</a>
        </div>
        <p class="text-center text-gray-600 text-sm mt-6">
            Don't have an account? <a href="/register" class="text-emerald-600 font-semibold hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
