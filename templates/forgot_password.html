{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-800 p-6 rounded-xl">
    <h2 class="text-2xl font-bold text-emerald-400 mb-4 text-center">Forgot Password</h2>
    <form method="POST">
        <input type="email" name="email" placeholder="Your username/email" required class="w-full p-2 bg-slate-700 rounded mb-4">
        <button type="submit" class="w-full bg-emerald-600 py-2 rounded">Send Reset Link</button>
    </form>
    <p class="text-center mt-4"><a href="{{ url_for('login') }}" class="text-emerald-400">Back to Login</a></p>
</div>
{% endblock %}
