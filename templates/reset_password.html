{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-800 p-6 rounded-xl">
    <h2 class="text-2xl font-bold text-emerald-400 mb-4 text-center">Reset Password</h2>
    <form method="POST">
        <input type="password" name="password" placeholder="New Password" required class="w-full p-2 bg-slate-700 rounded mb-3">
        <input type="password" name="confirm_password" placeholder="Confirm Password" required class="w-full p-2 bg-slate-700 rounded mb-4">
        <button type="submit" class="w-full bg-emerald-600 py-2 rounded">Reset Password</button>
    </form>
</div>
{% endblock %}
