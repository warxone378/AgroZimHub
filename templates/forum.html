{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <h2 class="text-2xl font-bold text-emerald-400 mb-4">🌾 Farmer Forum</h2>
    <a href="{{ url_for('new_post') }}" class="bg-emerald-600 px-3 py-1 rounded inline-block mb-4">+ New Post</a>
    {% for post in posts %}
    <div class="bg-slate-800 p-4 rounded-xl mb-3">
        <div class="flex justify-between">
            <h3 class="font-bold">{{ post.title }}</h3>
            <span class="text-xs text-slate-400">{{ post.date }}</span>
        </div>
        <p class="text-sm">{{ post.content[:100] }}...</p>
        <a href="{{ url_for('view_post', post_id=post.id) }}" class="text-emerald-400 text-sm">Read more</a>
    </div>
    {% else %}
    <p class="text-slate-400">No posts yet. Start the conversation!</p>
    {% endfor %}
</div>
{% endblock %}
